[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "fastapi>=0.111",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
]

[project.scripts]
athena-db = "athena.cli.db:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["athena*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
source = ["athena"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "alembic/*",
    "validate_sprint_*.py",
    "db_bootstrap.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
