# Alembic configuration for Athena AI
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone to use when rendering the date within the migration file's "Revision ID"
# comment. Defaults to UTC. Specify pytz.timezone() string here.
# timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to "true" to run the environment during the "revision" command
# even if migration is autogenerated. Useful when there are function
# definitions in env.py that need to run to generate the migration.
revision_environment = false

# Set to "true" to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the versions/
# directory.
sourceless = false

# Version location specification; this defaults to alembic/versions.
# When using multiple version directories, initial revisions must
# be specified with --version-path.
# The path separator used here should be the separator specified by "version_path_separator" below.
version_locations = %(here)s/alembic/versions

# Version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", which uses
# os.pathsep. Note that this must not include any characters
# that might appear in a directory path.
version_path_separator = os

# The output encoding used when revision files
# are written from script.py.mako; defaults to utf-8.
output_encoding = utf-8

# Default SQLite URL — overridden by DATABASE_URL env var or CLI flags
sqlalchemy.url = sqlite:///athena.db


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
